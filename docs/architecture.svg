<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
    <style>
      .layer { rx: 12; }
      .chip { rx: 7; }
      .t { fill:#1f2937; }
      .sub { fill:#6b7280; font-size:11px; }
      .h { font-weight:700; }
    </style>
  </defs>

  <rect width="980" height="720" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">智能体中台 · 项目架构图</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#6b7280">FastAPI（接入） + LangGraph（编排） + Milvus / ES / Redis / MySQL（存储）</text>

  <!-- ============ 接入层 ============ -->
  <rect class="layer" x="40" y="78" width="900" height="96" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="60" y="102" class="h" font-size="14" fill="#4338ca">接入层 · FastAPI 网关</text>
  <g font-size="12" fill="#312e81" text-anchor="middle">
    <rect class="chip" x="60" y="116" width="160" height="44" fill="#c7d2fe"/><text x="140" y="135">对话 / SSE / WS 接口</text><text x="140" y="152" class="sub" fill="#4338ca">流式输出 · 首字低延迟</text>
    <rect class="chip" x="240" y="116" width="160" height="44" fill="#c7d2fe"/><text x="320" y="135">知识库 / 文档接口</text><text x="320" y="152" class="sub" fill="#4338ca">上传 · 列举 · 状态</text>
    <rect class="chip" x="420" y="116" width="140" height="44" fill="#c7d2fe"/><text x="490" y="135">api_key 鉴权</text><text x="490" y="152" class="sub" fill="#4338ca">Bearer Token</text>
    <rect class="chip" x="580" y="116" width="140" height="44" fill="#c7d2fe"/><text x="650" y="135">滑动窗口限流</text><text x="650" y="152" class="sub" fill="#4338ca">Redis 计数</text>
    <rect class="chip" x="740" y="116" width="180" height="44" fill="#c7d2fe"/><text x="830" y="135">trace_id 中间件</text><text x="830" y="152" class="sub" fill="#4338ca">全链路埋点</text>
  </g>

  <!-- arrow 接入 -> 编排 -->
  <line x1="490" y1="174" x2="490" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 编排层 ============ -->
  <rect class="layer" x="40" y="198" width="900" height="118" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="60" y="222" class="h" font-size="14" fill="#0e7490">编排层 · LangGraph 工作流引擎</text>
  <g font-size="12" fill="#164e63" text-anchor="middle">
    <rect class="chip" x="60" y="236" width="180" height="48" fill="#a5f3fc"/><text x="150" y="256">路由 Agent</text><text x="150" y="273" class="sub" fill="#0e7490">判断是否需检索</text>
    <rect class="chip" x="260" y="236" width="180" height="48" fill="#a5f3fc"/><text x="350" y="256">检索 Agent</text><text x="350" y="273" class="sub" fill="#0e7490">并行召回 + Rerank</text>
    <rect class="chip" x="460" y="236" width="180" height="48" fill="#a5f3fc"/><text x="550" y="256">生成 Agent</text><text x="550" y="273" class="sub" fill="#0e7490">LLM 流式作答</text>
    <rect class="chip" x="660" y="236" width="260" height="48" fill="#cffafe"/><text x="790" y="256">状态 / 分支 / 循环 / Human-in-loop</text><text x="790" y="273" class="sub" fill="#0e7490">Redis Checkpointer 持久化</text>
  </g>

  <!-- arrow 编排 -> 存储 -->
  <line x1="490" y1="316" x2="490" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 检索 & 存储层 ============ -->
  <rect class="layer" x="40" y="340" width="900" height="170" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="60" y="364" class="h" font-size="14" fill="#15803d">检索 &amp; 存储层（多引擎各司其职）</text>
  <g font-size="12" fill="#14532d" text-anchor="middle">
    <rect class="chip" x="60" y="378" width="200" height="112" fill="#bbf7d0"/><text x="160" y="404" class="h" font-size="13">Milvus</text><text x="160" y="426">向量检索</text><text x="160" y="446" class="sub" fill="#15803d">语义相似召回</text><text x="160" y="466" class="sub" fill="#15803d">按 kb 分区</text><text x="160" y="486" class="sub" fill="#15803d">仅存 向量+doc_id</text>
    <rect class="chip" x="280" y="378" width="200" height="112" fill="#bbf7d0"/><text x="380" y="404" class="h" font-size="13">Elasticsearch</text><text x="380" y="426">全文检索</text><text x="380" y="446" class="sub" fill="#15803d">关键词 / 过滤</text><text x="380" y="466" class="sub" fill="#15803d">高亮</text><text x="380" y="486" class="sub" fill="#15803d">存原文片段</text>
    <rect class="chip" x="500" y="378" width="200" height="112" fill="#bbf7d0"/><text x="600" y="404" class="h" font-size="13">Redis</text><text x="600" y="426">缓存 / 状态</text><text x="600" y="446" class="sub" fill="#15803d">会话缓存</text><text x="600" y="466" class="sub" fill="#15803d">任务队列</text><text x="600" y="486" class="sub" fill="#15803d">限流 / 分布式锁</text>
    <rect class="chip" x="720" y="378" width="200" height="112" fill="#bbf7d0"/><text x="820" y="404" class="h" font-size="13">MySQL</text><text x="820" y="426">业务元数据</text><text x="820" y="446" class="sub" fill="#15803d">用户 / 知识库</text><text x="820" y="466" class="sub" fill="#15803d">文档 / 会话</text><text x="820" y="486" class="sub" fill="#15803d">仅存元字段</text>
  </g>

  <!-- arrow 存储 -> 基础能力 -->
  <line x1="490" y1="510" x2="490" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 基础能力 ============ -->
  <rect class="layer" x="40" y="542" width="900" height="86" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="566" class="h" font-size="14" fill="#b45309">基础能力（可替换 / 可指向本地部署）</text>
  <g font-size="12" fill="#92400e" text-anchor="middle">
    <rect class="chip" x="60" y="580" width="270" height="40" fill="#fde68a"/><text x="195" y="605">LLM 服务（OpenAI 兼容）</text>
    <rect class="chip" x="350" y="580" width="270" height="40" fill="#fde68a"/><text x="485" y="605">Embedding 服务（BGE / 兼容）</text>
    <rect class="chip" x="640" y="580" width="280" height="40" fill="#fde68a"/><text x="780" y="605">工具插件（API / 数据库）</text>
  </g>

  <!-- 基础能力 -> 编排/检索 虚线 -->
  <path d="M195,580 C195,520 350,420 550,316" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dasharrow)"/>
  <path d="M485,580 C485,520 600,470 600,450" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dasharrow)"/>

  <text x="490" y="660" text-anchor="middle" class="sub" fill="#9ca3af">部署：docker-compose 编排 8 个服务（api / ingest / mysql / redis / etcd / minio / milvus / elasticsearch）</text>
  <text x="490" y="682" text-anchor="middle" class="sub" fill="#9ca3af">缓存策略：热点 query 检索结果 Redis 缓存(TTL 600s)；会话/状态均设 TTL 防内存膨胀</text>
</svg>
