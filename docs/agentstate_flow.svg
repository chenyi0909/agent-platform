<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>AgentState 在 LangGraph 图中的流转与参数补充机制</title>
<desc>展示初始 state 注入、三个节点如何以 return dict 补充全局状态，以及 messages 通道的 add_messages 累加 reducer。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">AgentState 在图中的流转（参数补充机制）</text>

<rect x="40" y="54" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">初始注入：graph.ainvoke({query, user_id, kb_id, messages:[]}) · 未传字段走 TypedDict 默认值</text>

<line x1="340" y1="94" x2="125" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="116" width="170" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="125" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">router</text>
<text x="125" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">返回 {route_decision}</text>

<rect x="255" y="116" width="170" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">retriever</text>
<text x="340" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">返回检索结果+context</text>

<rect x="470" y="116" width="170" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="555" y="132" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">generator</text>
<text x="555" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">返回 answer+messages</text>

<line x1="210" y1="139" x2="255" y2="139" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="425" y1="139" x2="470" y2="139" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="125" y1="162" x2="125" y2="200" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="340" y1="162" x2="340" y2="200" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="555" y1="162" x2="555" y2="200" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>

<rect x="40" y="200" width="600" height="196" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="224" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">全局 AgentState —— 节点 return 的 dict 自动 merge 进此账本</text>

<rect x="60" y="242" width="270" height="140" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="195" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">覆盖字段 · dict 语义</text>
<text x="72" y="284" font-family="sans-serif" font-size="12" fill="#0C447C">query / user_id / kb_id</text>
<text x="72" y="304" font-family="sans-serif" font-size="12" fill="#0C447C">route_decision</text>
<text x="72" y="324" font-family="sans-serif" font-size="12" fill="#0C447C">milvus_hits / es_hits</text>
<text x="72" y="344" font-family="sans-serif" font-size="12" fill="#0C447C">fused_hits / context</text>
<text x="72" y="364" font-family="sans-serif" font-size="12" fill="#0C447C">answer</text>

<rect x="350" y="242" width="270" height="140" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="485" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">追加字段 · add_messages</text>
<text x="362" y="288" font-family="sans-serif" font-size="12" fill="#633806">messages: list[BaseMessage]</text>
<text x="362" y="312" font-family="sans-serif" font-size="12" fill="#633806">节点返回时追加，不清空历史</text>
<text x="362" y="336" font-family="sans-serif" font-size="12" fill="#633806">→ 多轮对话上下文累积来源</text>
<text x="362" y="360" font-family="sans-serif" font-size="12" fill="#633806">generator 返回 AIMessage 即 append</text>
</svg>
